<style>
:root{
  --bg:#0e1327;
  --bg-2:#0b0e20;
  --surface:#1b2140;
  --surface-2:#242b4f;
  --surface-3:#2d3560;
  --accent:#58cc02;
  --accent-2:#46a302;
  --accent-dim:#243d10;
  --gold:#ffc800;
  --gold-2:#e0a800;
  --fire:#ff9600;
  --blue:#1cb0f6;
  --blue-2:#0e93d4;
  --mint:#4fe3a1;
  --mint-dim:#1f5c47;
  --danger:#ff4b4b;
  --danger-2:#e63e3e;
  --danger-dim:#5c2323;
  --text:#eef0f9;
  --muted:#8b92b8;
  --line:#323a68;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 500px at 85% -8%, rgba(88,204,2,.14) 0%, transparent 60%),
    radial-gradient(700px 500px at -10% 10%, rgba(28,176,246,.10) 0%, transparent 55%),
    radial-gradient(1200px 800px at 80% -10%, #1a2050 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
code, .mono, .code-block{font-family:'JetBrains Mono',monospace;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
button:focus-visible, .option:focus-visible, .node:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
::selection{background:var(--accent); color:#082900;}
@keyframes popIn{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(88,204,2,.55);} 70%{box-shadow:0 0 0 14px rgba(88,204,2,0);} 100%{box-shadow:0 0 0 0 rgba(88,204,2,0);}}
@keyframes shimmer{0%{background-position:-200px 0;} 100%{background-position:200px 0;}}

/* ---------- App shell ---------- */
#app{max-width:900px;margin:0 auto;padding:0 20px 60px;}

.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 4px; background:var(--bg);
  will-change:transform;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; letter-spacing:.2px;}
.brand .dot{width:12px;height:12px;border-radius:4px;background:var(--accent); box-shadow:0 0 14px var(--accent);}
.stats{display:flex; gap:8px; align-items:center;}
.stat{
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border:2px solid var(--line); box-shadow:0 2px 0 rgba(0,0,0,.25);
  padding:6px 12px 6px 8px; border-radius:999px; font-weight:800; font-size:14px;
  transition:transform .15s ease;
}
.stat .ico{
  width:22px;height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0;
}
.stat.hearts{color:#ffd4d4;}
.stat.hearts .ico{background:var(--danger-dim);}
.stat.xp{color:#e8f7d0;}
.stat.xp .ico{background:var(--accent-dim);}
.stat.gems{color:#cdeeff;}
.stat.gems .ico{background:#0e3a55;}
.stat.streak{color:#ffe3c2;}
.stat.streak .ico{background:#5c3a10;}
.stat.combo{color:var(--mint);}
.stat.pop{animation:popIn .3s ease;}

/* ---------- Path screen ---------- */
.hero{
  margin:18px 0 30px; padding:26px 24px; border-radius:22px;
  background:linear-gradient(135deg, #1c2f22, #131735 75%);
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; right:-40px; top:-40px; width:200px; height:200px;
  background:radial-gradient(circle, rgba(88,204,2,.28), transparent 70%);
}
.hero::before{
  content:'🦉'; position:absolute; right:22px; top:18px; font-size:54px;
  animation:floaty 3.2s ease-in-out infinite; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
}
.hero h1{margin:0 0 8px; font-size:26px;}
.hero p{margin:0; color:var(--muted); max-width:440px; line-height:1.5; font-size:14.5px;}

.unit{margin-bottom:38px; content-visibility:auto; contain-intrinsic-size:0 900px;}
.unit-header{
  display:flex; align-items:center; gap:10px; margin:0 0 26px;
  color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:1.4px; font-weight:700;
}
.unit-header .num{
  width:26px;height:26px;border-radius:7px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center; color:var(--text); font-size:12px;
}
.unit-header .line{flex:1; height:1px; background:var(--line);}

.path{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;}
.node-row{display:flex; justify-content:center; width:100%; position:relative;}
.node-wrap{position:relative; display:flex; flex-direction:column; align-items:center; z-index:2;}
.node{
  width:74px; height:74px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; position:relative; transition:transform .1s ease, box-shadow .1s ease;
  border:none; animation:popIn .35s ease backwards;
}
.node:active:not(:disabled){transform:translateY(4px);}
.node:hover:not(:disabled){transform:translateY(-3px);}
.node:active:not(:disabled){transform:translateY(2px);}
.node.locked{background:var(--surface-2); color:var(--muted); border:3px solid var(--line); box-shadow:0 5px 0 var(--line); cursor:not-allowed;}
.node.available{background:var(--accent); color:#0b2400; box-shadow:0 6px 0 var(--accent-2), 0 10px 22px -6px rgba(88,204,2,.55);}
.node.available.current{animation:popIn .35s ease backwards, ringPulse 2.2s ease-in-out infinite;}
.node.available.current::after{
  content:'EMPIEZA'; position:absolute; top:-38px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#3a2900; font-size:11px; font-weight:800; letter-spacing:.4px;
  padding:5px 10px; border-radius:8px; white-space:nowrap; box-shadow:0 3px 0 var(--gold-2);
}
.node.available.current::before{
  content:''; position:absolute; top:-12px; left:50%; transform:translateX(-50%);
  border:6px solid transparent; border-top-color:var(--gold);
}
.node.done{background:var(--mint); color:#04241a; box-shadow:0 6px 0 var(--mint-dim);}
.node.challenge.available{background:linear-gradient(135deg,#ff8fd0,#a06bff); box-shadow:0 6px 0 #6b3fc9, 0 10px 22px -6px rgba(160,107,255,.55); color:#20063f;}
.node.challenge.done{background:linear-gradient(135deg,#7be6c4,#4fe3a1); box-shadow:0 6px 0 #2f9a6f;}
.node.exam-node.available{background:linear-gradient(135deg,#ffd23f,var(--gold)); box-shadow:0 6px 0 var(--gold-2), 0 10px 22px -6px rgba(255,200,0,.55); color:#3a2900;}
.node.exam-node.done{background:linear-gradient(135deg,#ffe27a,var(--gold)); box-shadow:0 6px 0 var(--gold-2);}
.node-label{margin-top:8px; font-size:12.5px; font-weight:700; color:var(--muted); max-width:110px; text-align:center;}
.node.available .node-label, .node.done .node-label{color:var(--text);}
.node-wrap:nth-child(odd) .node-row-offset{margin-left:-70px;}
.connector{width:5px; height:34px; background:var(--line); border-radius:3px; z-index:1;}
.connector.done{background:var(--accent);}

/* zigzag positions */
.path .node-row:nth-of-type(4n+2) .node-wrap{transform:translateX(64px);}
.path .node-row:nth-of-type(4n+3) .node-wrap{transform:translateX(90px);}
.path .node-row:nth-of-type(4n+4) .node-wrap{transform:translateX(64px);}

/* ---------- Lesson screen ---------- */
.lesson-screen{padding-top:6px;}
.lesson-top{display:flex; align-items:center; gap:12px; margin:10px 0 28px;}
.close-btn{
  background:none; color:var(--muted); font-size:22px; line-height:1; padding:6px;
  border-radius:8px;
}
.close-btn:hover{color:var(--text); background:var(--surface-2);}
.progress-track{flex:1; height:14px; background:var(--surface-2); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),#7ee62b); border-radius:999px; transition:width .35s ease; box-shadow:0 0 10px rgba(88,204,2,.5);}
.hearts-inline{display:flex; gap:3px; font-size:18px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}

.q-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 24px; margin-bottom:20px; position:relative;
}
.q-card-wrap{position:relative;}
.lesson-mascot{
  position:absolute; top:-30px; right:14px; font-size:38px; z-index:3;
  animation:floaty 3s ease-in-out infinite; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));
}
.lesson-mascot.happy{animation:mascotHappy .5s ease;}
.lesson-mascot.sad{animation:mascotSad .4s ease;}
@keyframes mascotHappy{0%{transform:scale(1) rotate(0);} 35%{transform:scale(1.3) rotate(-10deg);} 65%{transform:scale(1.1) rotate(8deg);} 100%{transform:scale(1) rotate(0);}}
@keyframes mascotSad{0%{transform:translateY(0) rotate(0);} 40%{transform:translateY(6px) rotate(-6deg);} 70%{transform:translateY(2px) rotate(4deg);} 100%{transform:translateY(0) rotate(0);}}
.report-btn{
  position:absolute; top:14px; right:14px; background:none; color:var(--muted);
  font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; border:1px solid transparent;
}
.report-btn:hover{color:var(--danger); border-color:var(--danger);}
.report-btn.sent{color:var(--accent); cursor:default;}
.q-kicker{font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--accent); font-weight:700; margin-bottom:10px;}
.q-prompt{font-size:19px; font-weight:600; line-height:1.4; margin:0 0 16px;}
.code-block{
  background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; font-size:14.5px; line-height:1.6; white-space:pre; overflow-x:auto;
  color:#c9e8ff; margin-bottom:16px;
}
.code-block .cm{color:#6b7bb0;}

.options{display:flex; flex-direction:column; gap:10px;}
.option{
  background:var(--surface-2); border:2px solid var(--line); border-radius:14px;
  padding:14px 16px; text-align:left; font-size:15px; color:var(--text);
  display:flex; align-items:center; gap:10px; transition:.12s ease;
  box-shadow:0 3px 0 var(--line);
}
.option:hover:not(:disabled){border-color:var(--accent); transform:translateY(-1px);}
.option:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.option.selected{border-color:var(--blue); background:#122a3d; box-shadow:0 3px 0 var(--blue-2);}
.option.correct{border-color:var(--accent); background:var(--accent-dim); color:#e8ffd0; box-shadow:0 3px 0 var(--accent-2);}
.option.incorrect{border-color:var(--danger); background:var(--danger-dim); color:#ffd4d4; box-shadow:0 3px 0 var(--danger-2);}
.option:disabled{cursor:default;}
.option .letter{
  width:26px;height:26px;border-radius:8px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0;
}
.option.selected .letter{background:var(--blue); color:#fff;}
.option.correct .letter{background:var(--accent); color:#0b2400;}
.option.incorrect .letter{background:var(--danger); color:#3a0808;}

.tf-row{display:flex; gap:12px;}
.tf-row .option{flex:1; justify-content:center; font-weight:700;}

.fill-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.fill-input{
  background:var(--surface-2); border:2px solid var(--line); border-radius:10px;
  padding:12px 14px; color:var(--text); font-size:15px; font-family:'JetBrains Mono',monospace;
  min-width:160px;
}
.fill-input:focus{outline:none; border-color:var(--accent);}
.fill-input.correct{border-color:var(--mint);}
.fill-input.incorrect{border-color:var(--danger);}

.order-list{display:flex; flex-direction:column; gap:8px; min-height:44px;}
.order-slot{
  border:2px dashed var(--line); border-radius:10px; padding:12px 14px;
  color:var(--muted); font-size:14px; font-family:'JetBrains Mono',monospace; min-height:22px;
}
.order-slot.filled{border-style:solid; color:var(--text); background:var(--surface-2); display:flex; justify-content:space-between; align-items:center;}
.order-bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.chip{
  background:var(--surface-3); border:1px solid var(--line); border-radius:9px;
  padding:9px 13px; font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--text);
}
.chip:hover{border-color:var(--accent);}
.chip-remove{background:none; color:var(--muted); font-size:12px; margin-left:10px;}

.actions{display:flex; justify-content:flex-end;}
.btn{
  padding:14px 26px; border-radius:14px; font-weight:800; font-size:15px; letter-spacing:.3px;
  text-transform:uppercase; transition:transform .08s ease, box-shadow .08s ease;
}
.btn-primary{background:var(--accent); color:#0b2400; box-shadow:0 5px 0 var(--accent-2);}
.btn-primary:disabled{background:var(--surface-2); color:var(--muted); cursor:not-allowed; box-shadow:0 5px 0 var(--line);}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);}
.btn-primary:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--accent-2);}
.btn-ghost{background:none; color:var(--muted); border:2px solid var(--line);}
.btn-ghost:hover{border-color:var(--accent); color:var(--text);}

.feedback{
  position:sticky; bottom:0; left:0; right:0; margin-top:10px;
  border-radius:16px 16px 0 0; padding:20px 24px; animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.feedback.correct{background:#16311a; border-top:4px solid var(--accent);}
.feedback.incorrect{background:#2d1414; border-top:4px solid var(--danger);}
.feedback-head{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; margin-bottom:8px;}
.feedback.correct .feedback-head{color:var(--accent);}
.feedback.incorrect .feedback-head{color:var(--danger);}
.feedback-body{color:var(--text); font-size:14.5px; line-height:1.55; margin-bottom:16px;}
.feedback-body b{color:#fff;}
.feedback .actions{align-items:center;}

.shake{animation:shake .35s;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);}
}
.pulse-correct{animation:pulseC .3s ease;}
@keyframes pulseC{0%{transform:scale(1);} 50%{transform:scale(1.03);} 100%{transform:scale(1);}}

/* ---------- Summary / dead screens ---------- */
.center-screen{text-align:center; padding:60px 20px;}
.center-screen .big-emoji{font-size:70px; margin-bottom:6px;}
.center-screen h2{font-size:26px; margin:0 0 6px;}
.center-screen p{color:var(--muted); margin:0 0 26px; font-size:15px;}

/* ---------- Skeleton loaders ---------- */
.skel{
  background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size:400px 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:10px;
}
.skel-wrap{max-width:900px; margin:0 auto; padding:20px;}
.skel-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
.skel-pill{width:70px; height:30px; border-radius:999px;}
.skel-hero{height:110px; border-radius:20px; margin-bottom:30px;}
.skel-row{display:flex; gap:22px; justify-content:center; margin-bottom:24px;}
.skel-node{width:74px; height:74px; border-radius:50%;}
.summary-stats{display:flex; justify-content:center; gap:16px; margin-bottom:32px; flex-wrap:wrap;}
.summary-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 26px; min-width:120px;}
.summary-card .val{font-size:24px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.summary-card .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-top:4px;}
.summary-card.xp .val{color:var(--accent);}
.summary-card.acc .val{color:var(--mint);}

/* ---------- Theory / teaching screen ---------- */
.theory-card{padding:28px 26px;}
.theory-kicker-icon{font-size:34px; margin-bottom:10px; display:block;}
.theory-title{font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 14px; color:var(--text);}
.theory-body{color:var(--text); font-size:15px; line-height:1.7;}
.theory-body p{margin:0 0 14px;}
.theory-body ul, .theory-body ol{margin:0 0 14px; padding-left:22px;}
.theory-body li{margin-bottom:8px; line-height:1.6;}
.theory-body b{color:var(--accent);}
.theory-body code{background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-family:'JetBrains Mono',monospace; font-size:14px; color:#c9e8ff;}
.theory-note{margin-top:16px; padding:12px 14px; background:var(--surface-2); border-left:3px solid var(--mint); border-radius:8px; font-size:14px; color:var(--muted);}

/* ---------- Login screen ---------- */
.login-wrap{min-height:92vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{max-width:360px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:34px 28px; text-align:center;}
.login-card .brand{justify-content:center; margin-bottom:8px;}
.login-card h2{margin:12px 0 6px; font-size:22px;}
.login-card p{color:var(--muted); font-size:14px; margin:0 0 24px; line-height:1.5;}
.login-field{text-align:left; margin-bottom:14px;}
.login-field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;}
.login-field input{width:100%; background:var(--surface-2); border:2px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:15px;}
.login-field input:focus{outline:none; border-color:var(--accent);}
.login-error{color:var(--danger); font-size:13.5px; margin:-2px 0 14px; text-align:left;}
.login-card .btn-primary{width:100%; margin-top:6px;}
.track-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
@media (max-width:480px){.track-grid{grid-template-columns:1fr;}}
.track-card{
  background:var(--surface-2); border:2px solid var(--line); border-radius:14px;
  padding:16px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; transition:.12s ease;
}
.track-card:hover{border-color:var(--accent); transform:translateY(-2px);}
.track-icon{font-size:26px;}
.track-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15.5px; color:var(--text);}
.track-desc{color:var(--muted); font-size:12.5px; line-height:1.4;}
.track-xp{color:var(--accent); font-weight:700; font-size:12.5px; margin-top:4px;}
.logout-btn{background:none; color:var(--muted); font-size:15px; padding:6px 8px; border-radius:8px;}
.logout-btn:hover{color:var(--text); background:var(--surface-2);}

@media (max-width:520px){
  .node{width:62px;height:62px; font-size:22px;}
  .hero h1{font-size:22px;}
  .path .node-row:nth-of-type(4n+2) .node-wrap{transform:translateX(30px);}
  .path .node-row:nth-of-type(4n+3) .node-wrap{transform:translateX(46px);}
  .path .node-row:nth-of-type(4n+4) .node-wrap{transform:translateX(30px);}
  .brand{font-size:16px; gap:6px;}
  .stats{gap:5px;}
  .stat{padding:6px 9px 6px 7px; font-size:13px;}

async function storageGet(key){
  if(!FIREBASE_CONFIGURED) return null;
  try{
    const snap = await db.collection('codepath').doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return data && data.value !== undefined ? JSON.parse(data.value) : null;
  }catch(e){ console.error('Error leyendo Firestore', e); return null; }
}
async function storageSet(key, value){
  if(!FIREBASE_CONFIGURED) return false;
  try{ await db.collection('codepath').doc(key).set({ value: JSON.stringify(value) }); return true; }
  catch(e){ console.error('Error guardando en Firestore', e); return false; }
}
async function loadAdminData(){
  const users = await storageGet('users');
  if(Array.isArray(users) && users.length) USERS = users;
  const status = await storageGet('site_status');
  if(status && typeof status==='object') SITE_STATUS = status;
}
async function logLoginEvent(username){
  const stats = (await storageGet('stats')) || { logins:[] };
  stats.logins = Array.isArray(stats.logins) ? stats.logins : [];
  stats.logins.push({ username, ts: Date.now() });
  if(stats.logins.length>300) stats.logins = stats.logins.slice(-300);
  await storageSet('stats', stats);
}

function allLessonsFlat(){
  const flat=[];
  curriculum().forEach((u,ui)=>u.lessons.forEach((l,li)=>flat.push({u,ui,l,li})));
  return flat;
}
function isLessonUnlocked(ui,li){
  const flat = allLessonsFlat();
  const idx = flat.findIndex(f=>f.ui===ui && f.li===li);
  if(idx===0) return true;
  const prev = flat[idx-1];
  return state.completed.has(prev.l.id) || idx===0;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

      </form>

  app.innerHTML = html;

async function doLogin(){
  const userInput = document.getElementById('loginUser');
  const passInput = document.getElementById('loginPass');
  const user = userInput.value.trim();
  const pass = passInput.value;
  const match = USERS.find(u=>u.username===user && u.password===pass);
  if(!match){
    state.loginError='Usuario o contraseña incorrectos.';
    render();
    return;
  }
  if(match.blocked){
    state.loginError='Tu cuenta ha sido bloqueada por un administrador.';
    render();
    return;
  }
  // Pide al navegador que ofrezca guardar/recordar esta contraseña.
  // Como la app no recarga la página (es una SPA), el aviso automático
  // de "Guardar contraseña" no siempre aparece solo con el <form>,
  // así que lo disparamos explícitamente con la Credential Management API.
  if(window.PasswordCredential){
    try{
      const cred = new PasswordCredential({ id:user, password:pass, name:'CodePath' });
      await navigator.credentials.store(cred);
    }catch(err){ /* el navegador puede no soportarlo o el usuario puede rechazarlo; no bloquea el login */ }
  }
  state.loginError='';
  state.loginBusy=true;
  state.currentUser=user;
  render();
  logLoginEvent(user);
  await loadProgress(user);
  updateStreak();
  state.loginBusy=false;
  state.screen='tracks';
  render();
}

const STORAGE_PREFIX = 'codepath_progress_';

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function updateStreak(){
  const today = todayStr();
  const last = state.lastActiveDate;
  if(last === today){
    // ya contado hoy
  } else if(last){
    const diffDays = Math.round((new Date(today) - new Date(last)) / 86400000);
    state.streak = diffDays === 1 ? (state.streak||0) + 1 : 1;
  } else {
    state.streak = 1;
  }
  state.lastActiveDate = today;
  saveProgress();
}

async function loadProgress(user){
  state.allProgress = {};
  state.streak = 1;
  state.lastActiveDate = null;
  // 1) intenta la nube (Firebase) — funciona en cualquier dispositivo
  const cloud = await storageGet('progress_'+user);
  if(cloud && typeof cloud === 'object'){
    state.allProgress = cloud.tracks || {};
    state.streak = cloud.streak || 1;
    state.lastActiveDate = cloud.lastActiveDate || null;
    return;
  }
  // 2) si no hay nube (offline o sin Firebase), usa la copia local del navegador
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+user);
    if(raw){
      const data = JSON.parse(raw);
      state.allProgress = data.tracks || {};
      state.streak = data.streak || 1;
      state.lastActiveDate = data.lastActiveDate || null;
    }
  }catch(e){
    console.error('No se pudo cargar el progreso', e);
  }
}

async function saveProgress(){
  if(!state.currentUser) return;
  if(state.track){
    state.allProgress[state.track] = {
      completed:[...state.completed],
      totalXP: state.totalXP,
    };
  }
  const payload = {
    tracks: state.allProgress,
    streak: state.streak,
    lastActiveDate: state.lastActiveDate,
  };
  try{
    localStorage.setItem(STORAGE_PREFIX+state.currentUser, JSON.stringify(payload));
  }catch(e){
    console.error('No se pudo guardar el progreso localmente', e);
  }
  // guarda también en la nube para que el progreso viaje entre dispositivos
  storageSet('progress_'+state.currentUser, payload).catch(()=>{});
}

function logout(){
  state.screen='login';
  state.currentUser=null;
  state.track=null;
  state.allProgress={};
  state.completed=new Set();

function selectTrack(trackKey){

  const saved = state.allProgress[trackKey] || {completed:[],totalXP:0};
  state.completed = new Set(saved.completed);
  state.totalXP = saved.totalXP;
  state.screen='path';

}

function renderPath(){
  const meta = TRACK_META[state.track] || TRACK_META.general;
  let html = topbarHTML(false);
  html += `
  <div class="hero">
    <h1>${meta.icon} ${meta.title}</h1>
    <p>Recorre el circuito, responde preguntas, resuelve desafíos de código y gana XP. Cada respuesta incorrecta te explica exactamente por qué — así aprendes de verdad, no de memoria.</p>
    <button class="btn btn-ghost" id="changeTrackBtn" style="margin-top:14px;">Cambiar de lenguaje</button>
  </div>`;

  const flat = allLessonsFlat();
  const nextIdx = flat.findIndex(f=>!state.completed.has(f.l.id) && isLessonUnlocked(f.ui,f.li));

  curriculum().forEach((unit,ui)=>{
    html += `<div class="unit">
      <div class="unit-header"><div class="num">${unit.icon}</div><span>${unit.title}</span><div class="line"></div></div>
      <div class="path">`;
    unit.lessons.forEach((lesson,li)=>{
      const idx = flat.findIndex(f=>f.ui===ui && f.li===li);
      const unlocked = isLessonUnlocked(ui,li);
      const done = state.completed.has(lesson.id);
      const isCurrent = idx===nextIdx;
      const stateClass = done?'done':(unlocked?'available':'locked');
      const challengeClass = lesson.type==='challenge' ? 'challenge' : '';
      if(li>0){
        html += `<div class="connector ${done||isLessonUnlocked(ui,li)?'done':''}"></div>`;
      }
      html += `
      <div class="node-row">
        <div class="node-wrap">
          <button class="node ${stateClass} ${challengeClass} ${isCurrent?'current':''}" ${unlocked?'':'disabled'} data-ui="${ui}" data-li="${li}" aria-label="${lesson.title}" style="animation-delay:${Math.min(idx,10)*40}ms">
            ${unlocked ? (done?'✓':lesson.icon) : '🔒'}
          </button>
          <div class="node-label">${lesson.title}</div>
        </div>
      </div>`;
    });

    const allUnitDone = unit.lessons.every(l=>state.completed.has(l.id));
    const examId = `examUnit_${state.track}_${ui}`;
    const examDone = state.completed.has(examId);
    html += `<div class="connector ${allUnitDone?'done':''}"></div>
      <div class="node-row">
        <div class="node-wrap">
          <button class="node exam-node ${examDone?'done':(allUnitDone?'available':'locked')}" ${allUnitDone?'':'disabled'} data-exam-ui="${ui}" aria-label="Examen de ${unit.title}">
            ${examDone?'✓':'🏆'}
          </button>
          <div class="node-label">Examen de unidad</div>
        </div>

    html += `</div></div>`;

      const ui = parseInt(btn.dataset.ui), li = parseInt(btn.dataset.li);
      startLesson(ui,li);
    });
  });
  app.querySelectorAll('.node[data-exam-ui]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      startExam(parseInt(btn.dataset.examUi));
    });
  });
  document.getElementById('changeTrackBtn')?.addEventListener('click', goToTracks);
}

function buildUnitExam(ui){
  const unit = curriculum()[ui];
  let pool = [];
  unit.lessons.forEach(l=>l.questions.forEach(q=>pool.push(q)));
  pool = shuffle(pool).slice(0, Math.min(10, pool.length));
  return { id:`examUnit_${state.track}_${ui}`, title:`Examen: ${unit.title}`, icon:'🏆', type:'exam', questions:pool };
}

function startExam(ui){
  state.activeUnitIdx=ui;
  state.activeLessonIdx=-1;
  state.examLesson = buildUnitExam(ui);
  state.hearts=5;
  state.combo=0;
  state.qIndex=0;
  state.correctCount=0;
  state.xpThisLesson=0;
  state.qOrder = state.examLesson.questions.map((q,i)=>i);
  state.screen='lesson';
  state.theoryIndex=0;
  state.showingTheory=false;
  prepQuestionUIState();
  render();
}

function startLesson(ui,li){
  state.examLesson=null;
  state.activeUnitIdx=ui;
  state.activeLessonIdx=li;
  state.hearts=5;
  state.combo=0;
  state.qIndex=0;
  state.correctCount=0;
  state.xpThisLesson=0;
  const lesson = curriculum()[ui].lessons[li];
  state.qOrder = lesson.questions.map((q,i)=>i); // keep original order (pedagogical progression)
  state.screen='lesson';
  state.theoryIndex=0;
  state.showingTheory = !!(lesson.theory && lesson.theory.length);
  prepQuestionUIState();
  render();
}

function prepQuestionUIState(){
  state.answered=false;
  state.selectedOption=null;
  state.reportSent=false;
  const q = currentQuestion();
  if(q && q.type==='order'){
    state.orderChosen=[];
    state.orderBank=shuffle(q.steps.map((s,i)=>({text:s,origIdx:i})));
  }
}

function currentLesson(){
  if(state.examLesson) return state.examLesson;
  return curriculum()[state.activeUnitIdx].lessons[state.activeLessonIdx];
}
function currentQuestion(){
  const lesson = currentLesson();
  if(!lesson) return null;
  const realIdx = state.qOrder[state.qIndex];
  return lesson.questions[realIdx];
}

function renderLesson(){
  const lesson = currentLesson();
  if(state.showingTheory){
    return renderTheory(lesson);
  }
  const q = currentQuestion();
  const total = lesson.questions.length;
  const progressPct = Math.round((state.qIndex/total)*100);
  const mascotMood = state.answered ? (state.lastCorrect?'happy':'sad') : '';

  let html = `
  <div class="lesson-screen">
    <div class="lesson-top">
      <button class="close-btn" id="closeBtn">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="hearts-inline">${'❤️'.repeat(state.hearts)}${'🖤'.repeat(5-state.hearts)}</div>
    </div>
    <div class="q-card-wrap">
      <div class="lesson-mascot ${mascotMood}">🦉</div>
      <div class="q-card">
        <button class="report-btn ${state.reportSent?'sent':''}" id="reportBtn" title="${state.reportSent?'Pregunta reportada':'Reportar esta pregunta'}">${state.reportSent?'✓ Reportado':'🚩 Reportar'}</button>
        <div class="q-kicker">${state.examLesson ? '🏆 Examen de unidad' : (lesson.type==='challenge' ? 'Desafío de código' : lesson.title)}</div>
        <div class="q-prompt">${q.prompt}</div>
        ${q.code ? `<div class="code-block">${escapeHTML(q.code)}</div>` : ''}
        ${renderQuestionBody(q)}
      </div>
    </div>
    ${state.answered ? renderFeedback(q) : renderActionsCheck(q)}
  </div>`;

  app.innerHTML = topbarHTML(true) + html;
  attachLessonHandlers(q);
  document.getElementById('reportBtn')?.addEventListener('click',()=>{
    if(state.reportSent) return;
    reportQuestion(q, lesson);
  });
}

function reportQuestion(q, lesson){
  state.reportSent = true;
  render();
  const trackMeta = TRACK_META[state.track] || TRACK_META.general;
  const report = {
    id: 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    username: state.currentUser,
    track: state.track,
    trackTitle: trackMeta.title,
    lessonId: lesson.id,
    lessonTitle: lesson.title,
    questionPrompt: q.prompt,
    ts: Date.now(),
  };
  storageGet('reports').then(existing=>{
    const list = Array.isArray(existing) ? existing : [];
    list.push(report);
    if(list.length>500) list.splice(0, list.length-500);
    return storageSet('reports', list);
  }).catch(()=>{});
}

function renderTheory(lesson){
  const pages = lesson.theory;
  const page = pages[state.theoryIndex];
  const progressPct = Math.round((state.theoryIndex/pages.length)*100);
  const isLast = state.theoryIndex+1 >= pages.length;

  let html = `
  <div class="lesson-screen">
    <div class="lesson-top">
      <button class="close-btn" id="closeBtn">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </div>
    <div class="q-card theory-card">
      <span class="theory-kicker-icon">${page.icon || lesson.icon}</span>
      <div class="q-kicker">${lesson.title} · Clase teórica</div>
      <h3 class="theory-title">${page.title}</h3>
      <div class="theory-body">${page.body}</div>
      ${page.code ? `<div class="code-block">${escapeHTML(page.code)}</div>` : ''}
      ${page.note ? `<div class="theory-note">💡 ${page.note}</div>` : ''}
    </div>
    <div class="actions"><button class="btn btn-primary" id="theoryNextBtn">${isLast?'Empezar práctica →':'Siguiente'}</button></div>
  </div>`;

  app.innerHTML = topbarHTML(true) + html;
  document.getElementById('closeBtn').addEventListener('click',()=>{
    state.screen='path'; render();
  });
  document.getElementById('theoryNextBtn').addEventListener('click',()=>{
    if(!isLast){ state.theoryIndex++; render(); }
    else { state.showingTheory=false; render(); }
  });
}

function escapeHTML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderQuestionBody(q){
  if(q.type==='mc' || q.type==='code_predict'){
    const letters=['A','B','C','D'];
    return `<div class="options">
      ${q.options.map((opt,i)=>`
        <button class="option" data-i="${i}" ${state.answered?'disabled':''}>
          <span class="letter">${letters[i]}</span><span>${escapeHTML(opt)}</span>
        </button>`).join('')}
    </div>`;
  }
  if(q.type==='tf'){
    return `<div class="tf-row">
      <button class="option" data-tf="true" ${state.answered?'disabled':''}>✓ Verdadero</button>
      <button class="option" data-tf="false" ${state.answered?'disabled':''}>✕ Falso</button>
    </div>`;
  }
  if(q.type==='fill'){
    return `<div class="fill-row">
      <input type="text" class="fill-input" id="fillInput" placeholder="Escribe tu respuesta" ${state.answered?'disabled':''} autocomplete="off">
    </div>`;
  }
  if(q.type==='order'){
    return `
      <div class="order-list" id="orderList">
        ${q.steps.map((_,i)=>{
          const chosen = state.orderChosen[i];
          return `<div class="order-slot ${chosen!==undefined?'filled':''}" data-slot="${i}">
            ${chosen!==undefined ? `<span>${escapeHTML(state.orderBank.find(c=>c.origIdx===chosen)?.text ?? chosenText(chosen,q))}</span>${state.answered?'':`<button class="chip-remove" data-remove="${i}">quitar</button>`}` : `paso ${i+1}`}
          </div>`;
        }).join('')}
      </div>
      <div class="order-bank" id="orderBank">
        ${state.orderBank.filter(c=>!state.orderChosen.includes(c.origIdx)).map(c=>`
          <button class="chip" data-pick="${c.origIdx}" ${state.answered?'disabled':''}>${escapeHTML(c.text)}</button>
        `).join('')}
      </div>`;
  }
  return '';
}
function chosenText(origIdx,q){ return q.steps[origIdx]; }

function renderActionsCheck(q){
  const canCheck = canCheckAnswer(q);
  return `<div class="actions"><button class="btn btn-primary" id="checkBtn" ${canCheck?'':'disabled'}>Comprobar</button></div>`;
}
function canCheckAnswer(q){
  if(q.type==='mc'||q.type==='code_predict') return state.selectedOption!==null;
  if(q.type==='tf') return state.selectedOption!==null;
  if(q.type==='fill') return true; // validated on click
  if(q.type==='order') return state.orderChosen.length===q.steps.length;
  return false;
}

function isAnswerCorrect(q){
  if(q.type==='mc'||q.type==='code_predict') return state.selectedOption===q.correct;
  if(q.type==='tf') return state.selectedOption===q.correct;
  if(q.type==='fill'){
    const input = document.getElementById('fillInput');
    const val = (input?input.value:'').trim().toLowerCase();
    const accepted = (q.accept||[q.answer]).map(a=>a.toLowerCase());
    return accepted.includes(val);
  }
  if(q.type==='order'){
    return state.orderChosen.every((origIdx,i)=>origIdx===i);
  }
  return false;
}

function renderFeedback(q){
  const correct = state.lastCorrect;
  let userAnswerLine='';
  if(!correct){
    if(q.type==='mc'||q.type==='code_predict'){
      userAnswerLine = `<div class="feedback-body">Tu respuesta: <b>${escapeHTML(q.options[state.selectedOption])}</b><br>Respuesta correcta: <b>${escapeHTML(q.options[q.correct])}</b></div>`;
    } else if(q.type==='tf'){
      userAnswerLine = `<div class="feedback-body">Tu respuesta: <b>${state.selectedOption?'Verdadero':'Falso'}</b><br>Respuesta correcta: <b>${q.correct?'Verdadero':'Falso'}</b></div>`;
    } else if(q.type==='fill'){
      userAnswerLine = `<div class="feedback-body">Respuesta correcta: <b>${escapeHTML(q.answer)}</b></div>`;
    } else if(q.type==='order'){
      userAnswerLine = `<div class="feedback-body">Orden correcto: <b>${q.steps.map(s=>escapeHTML(s)).join(' → ')}</b></div>`;
    }
  }
  return `
  <div class="feedback ${correct?'correct':'incorrect'}">
    <div class="feedback-head">${correct?'✓ ¡Correcto!':'✕ No es correcto'}</div>
    ${userAnswerLine}
    <div class="feedback-body">${q.explanation}</div>
    <div class="actions"><button class="btn btn-primary" id="continueBtn">Continuar</button></div>
  </div>`;
}

function attachLessonHandlers(q){
  document.getElementById('closeBtn')?.addEventListener('click',()=>{
    state.screen='path'; render();
  });

  if(!state.answered){
    if(q.type==='mc'||q.type==='code_predict'){
      app.querySelectorAll('.option[data-i]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          state.selectedOption = parseInt(btn.dataset.i);
          render();
        });
      });
    }
    if(q.type==='tf'){
      app.querySelectorAll('.option[data-tf]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          state.selectedOption = btn.dataset.tf==='true';
          render();
        });
      });
    }
    if(q.type==='fill'){
      const input = document.getElementById('fillInput');
      input?.addEventListener('keydown',(e)=>{
        if(e.key==='Enter'){ checkAnswer(q); }
      });
    }
    if(q.type==='order'){
      app.querySelectorAll('.chip[data-pick]').forEach(chip=>{
        chip.addEventListener('click',()=>{
          state.orderChosen.push(parseInt(chip.dataset.pick));
          render();
        });
      });
      app.querySelectorAll('.chip-remove[data-remove]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const slot = parseInt(btn.dataset.remove);
          state.orderChosen.splice(slot,1);
          render();
        });
      });
    }
    // highlight selection for mc/tf
    if(state.selectedOption!==null){
      if(q.type==='mc'||q.type==='code_predict'){
        app.querySelectorAll('.option[data-i]').forEach(btn=>{
          if(parseInt(btn.dataset.i)===state.selectedOption) btn.classList.add('selected');
        });
      } else if(q.type==='tf'){
        app.querySelectorAll('.option[data-tf]').forEach(btn=>{
          const val = btn.dataset.tf==='true';
          if(val===state.selectedOption) btn.classList.add('selected');
        });
      }
    }
    document.getElementById('checkBtn')?.addEventListener('click',()=>checkAnswer(q));
  } else {
    document.getElementById('continueBtn')?.addEventListener('click',()=>advance());
    // paint correctness
    if(q.type==='mc'||q.type==='code_predict'){
      app.querySelectorAll('.option[data-i]').forEach(btn=>{
        const i = parseInt(btn.dataset.i);
        if(i===q.correct) btn.classList.add('correct');
        else if(i===state.selectedOption) btn.classList.add('incorrect');
      });
    }
    if(q.type==='tf'){
      app.querySelectorAll('.option[data-tf]').forEach(btn=>{
        const val = btn.dataset.tf==='true';
        if(val===q.correct) btn.classList.add('correct');
        else if(val===state.selectedOption) btn.classList.add('incorrect');
      });
    }
    if(q.type==='fill'){
      const input = document.getElementById('fillInput');
      if(input) input.classList.add(state.lastCorrect?'correct':'incorrect');
    }
  }
}

function checkAnswer(q){
  const correct = isAnswerCorrect(q);
  state.lastCorrect = correct;
  state.answered = true;
  if(correct){
    state.combo++;
    const bonus = state.combo>=3 ? 15 : 10;
    state.xpThisLesson += bonus;
    state.correctCount++;
  } else {
    state.combo=0;
    state.hearts--;
  }
  render();
  const card = document.querySelector('.q-card');
  if(card) card.classList.add(correct?'pulse-correct':'shake');
}

function advance(){
  if(state.hearts<=0){
    state.screen='dead';
    render();
    return;
  }
  const lesson = currentLesson();
  if(state.qIndex+1 >= lesson.questions.length){
    state.completed.add(lesson.id);
    state.totalXP += state.xpThisLesson;
    state.screen='summary';
    saveProgress();
    render();
  } else {
    state.qIndex++;
    prepQuestionUIState();
    render();
  }
}

function renderSummary(){
  const lesson = currentLesson();
  const total = lesson.questions.length;
  const acc = Math.round((state.correctCount/total)*100);
  const html = `
  <div class="center-screen">
    <div class="big-emoji">🎉</div>
    <h2>¡Lección completada!</h2>
    <p>${lesson.title}</p>
    <div class="summary-stats">
      <div class="summary-card xp"><div class="val">+${state.xpThisLesson}</div><div class="lbl">XP ganado</div></div>
      <div class="summary-card acc"><div class="val">${acc}%</div><div class="lbl">Precisión</div></div>
      <div class="summary-card"><div class="val">${state.correctCount}/${total}</div><div class="lbl">Correctas</div></div>
    </div>
    <button class="btn btn-primary" id="backBtn">Continuar</button>
  </div>`;
  app.innerHTML = topbarHTML(false) + html;
  document.getElementById('backBtn').addEventListener('click',()=>{
    state.screen='path'; render();
  });
}

function renderDead(){
  const html = `
  <div class="center-screen">
    <div class="big-emoji">💔</div>
    <h2>Te quedaste sin corazones</h2>
    <p>No te preocupes, cada error es parte de aprender. Vuelve a intentarlo.</p>
    <button class="btn btn-primary" id="retryBtn">Reintentar lección</button>
    <br><br>
    <button class="btn btn-ghost" id="backBtn2">Volver al mapa</button>
  </div>`;
  app.innerHTML = topbarHTML(false) + html;
  document.getElementById('retryBtn').addEventListener('click',()=>{
    startLesson(state.activeUnitIdx, state.activeLessonIdx);
  });
  document.getElementById('backBtn2').addEventListener('click',()=>{
    state.screen='path'; render();
  });
}

async function init(){
  render();
  await loadAdminData();
  state.screen = SITE_STATUS.closed ? 'closed' : 'login';
  render();
}
init();
</script>
</body>
</html>
